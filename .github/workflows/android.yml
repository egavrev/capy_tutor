name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon test 2>&1 | tee -a /tmp/build.log

      - name: Build APKs
        env:
          CAPY_TUTOR_KEYSTORE_B64: ${{ secrets.CAPY_TUTOR_KEYSTORE_B64 }}
          CAPY_TUTOR_KEYSTORE_PASSWORD: ${{ secrets.CAPY_TUTOR_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$CAPY_TUTOR_KEYSTORE_B64" ]; then
            echo "$CAPY_TUTOR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/capy-tutor-release.jks"
            export CAPY_TUTOR_KEYSTORE_FILE="$RUNNER_TEMP/capy-tutor-release.jks"
            echo "Building debug + signed release"
            set -o pipefail
            ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee -a /tmp/build.log
            "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/*-release.apk | head -3
          else
            echo "::notice::CAPY_TUTOR_KEYSTORE_B64 secret not set: building the debug APK only"
            set -o pipefail
            ./gradlew --no-daemon assembleDebug 2>&1 | tee -a /tmp/build.log
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: capy-tutor-apk
          path: app/build/outputs/apk/**/*.apk

      # Keep the latest APKs on the `builds` branch so they can be downloaded straight from GitHub.
      - name: Publish APKs to the builds branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out
          # Unit test counts, so the result can be read from the builds branch.
          python3 - > /tmp/tests.txt <<'PY'
          import glob, xml.etree.ElementTree as ET
          from collections import defaultdict
          t = defaultdict(lambda: [0, 0, 0])
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              r = ET.parse(f).getroot(); m = f.split('/build/')[0]
              n, fl, er = int(r.get('tests', 0)), int(r.get('failures', 0)), int(r.get('errors', 0))
              t[m][0] += n; t[m][1] += fl + er
          for m, (n, bad, _) in sorted(t.items()):
              print(f"Unit tests {m}: {n - bad} passed, {bad} failed")
          PY
          cp app/build/outputs/apk/debug/*-debug.apk /tmp/out/capy-tutor-debug.apk
          if ls app/build/outputs/apk/release/*-release.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-release.apk /tmp/out/capy-tutor.apk
          fi
          cd /tmp/out
          printf 'Built from %s on %s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          cat /tmp/tests.txt >> BUILD.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "APKs for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: '**/build/reports/'

      # Compiler errors as annotations, and the full log on the ci-logs branch (readable without
      # downloading artifacts).
      - name: Report build errors
        if: failure() && github.event_name != 'pull_request'
        run: |
          grep -E '^e: |error:|FAILED|What went wrong' /tmp/build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          mkdir -p /tmp/logs && cp /tmp/build.log /tmp/logs/build.log
          cd /tmp/logs
          printf 'Failed build of %s\n' "$GITHUB_SHA" > README.txt
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build log for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

  # The owner's setup: a Mac with Java 17 and no Android SDK. The test bench must build and run there.
  mac-without-android-sdk:
    runs-on: macos-latest
    env:
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests of the plain-Kotlin modules
        run: ./gradlew --no-daemon :core:test :ai:test :testbench:test

      - name: Test bench starts (the same command as in the README)
        run: |
          ./gradlew --no-daemon -q --console=plain :testbench:run --args="--help" | tee help.txt
          grep -q "Capy Tutor test bench" help.txt
          ./gradlew --no-daemon -q --console=plain projects | tee projects.txt

  # Installs the debug APK on an Android 13 emulator (Vali's Galaxy Note 20 Ultra runs Android 13)
  # and takes screenshots in light mode, dark mode and at 130% font size.
  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch APK
        run: |
          git fetch --depth 1 origin builds
          git show origin/builds:capy-tutor-debug.apk > app.apk
          ls -la app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on an Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: adb install -r app.apk && OUT=shots bash tools/screenshots.sh

      - name: Publish screenshots to the screenshots branch
        if: always()
        run: |
          mkdir -p shots && cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for $GITHUB_SHA" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
