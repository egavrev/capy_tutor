# Which provider and model serves each call type (HANDOFF.md §4.2).
# Format: <provider>/<model>, or several separated by commas, tried in order (the router
# supports fallbacks; the MVP uses one entry per call, no fallback provider: decision 1).
# Model ids live here, never in code.
enrich_ideas=groq/openai/gpt-oss-120b
assess_recall=groq/openai/gpt-oss-120b
assess_answer=groq/openai/gpt-oss-120b
summarize_session=groq/openai/gpt-oss-120b
make_quiz=groq/openai/gpt-oss-120b
transcribe=groq/whisper-large-v3-turbo

# Per-call limits. max_completion_tokens includes the model's hidden reasoning tokens.
enrich_ideas.maxTokens=6000
assess_recall.maxTokens=1200
assess_answer.maxTokens=500
summarize_session.maxTokens=700
make_quiz.maxTokens=5000
temperature=0.2

# Time limits per call. Session calls pause gracefully after 20 s (HANDOFF §4.2);
# enrichment runs once at import and thinks longer.
timeoutMs=20000
enrich_ideas.timeoutMs=60000
make_quiz.timeoutMs=60000

# gpt-oss on Groq: reasoning effort low | medium | high. Low keeps latency and tokens down
# during a session; enrichment runs once per lesson at import, so it can think longer.
groq.reasoningEffort=low
enrich_ideas.reasoningEffort=medium
make_quiz.reasoningEffort=medium
groq.baseUrl=https://api.groq.com/openai/v1

# Prompt versions (files in prompts/<name>.<version>.txt)
prompt.system=v1
prompt.enrich_ideas=v2
prompt.assess_recall=v2
prompt.assess_answer=v2
prompt.summarize_session=v2
prompt.make_quiz=v1
