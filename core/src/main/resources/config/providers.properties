# Which provider and model serves each call type (HANDOFF.md §4.2).
# Format: <provider>/<model>. MVP: one entry per call, no fallback provider (decision 1).
# Model ids live here, never in code.
enrich_ideas=groq/openai/gpt-oss-120b
assess_recall=groq/openai/gpt-oss-120b
assess_answer=groq/openai/gpt-oss-120b
summarize_session=groq/openai/gpt-oss-120b
transcribe=groq/whisper-large-v3-turbo

# Per-call limits. max_completion_tokens includes the model's hidden reasoning tokens.
enrich_ideas.maxTokens=4000
assess_recall.maxTokens=1500
assess_answer.maxTokens=500
summarize_session.maxTokens=700
temperature=0.2

# gpt-oss on Groq: reasoning effort low | medium | high. Low keeps latency and tokens down.
groq.reasoningEffort=low
groq.baseUrl=https://api.groq.com/openai/v1

# Prompt versions (files in prompts/<name>.<version>.txt)
prompt.system=v1
prompt.enrich_ideas=v1
prompt.assess_recall=v1
